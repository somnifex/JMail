version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jmail
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:///./data/app.db
      - DATA_DIR=/app/data
      - EMAIL_STORAGE_PATH=/app/data/emails
    env_file:
      - .env
